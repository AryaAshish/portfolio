name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run
        env:
          AUTH_COOKIE_SECRET: ${{ secrets.AUTH_COOKIE_SECRET }}

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FITTRACK_SUPABASE_URL: ${{ secrets.FITTRACK_SUPABASE_URL }}
          FITTRACK_SUPABASE_KEY: ${{ secrets.FITTRACK_SUPABASE_KEY }}
          AUTH_COOKIE_SECRET: ${{ secrets.AUTH_COOKIE_SECRET }}
          NEXT_PUBLIC_FITTRACK_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_FITTRACK_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_FITTRACK_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_FITTRACK_PUBLIC_SUPABASE_ANON_KEY }}
          FITTRACK_PUBLIC_SUPABASE_SERVICE_KEY: ${{ secrets.FITTRACK_PUBLIC_SUPABASE_SERVICE_KEY }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
