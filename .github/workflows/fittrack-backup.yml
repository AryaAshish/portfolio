name: FitTrack Nightly Backup

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  group: fittrack-backup
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump all projects
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install postgresql-client 16
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Resolve backup metadata
        id: meta
        run: |
          STAMP=$(date -u +'%Y-%m-%dT%H%M%SZ')
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "artifact=fittrack-backup-$STAMP" >> "$GITHUB_OUTPUT"

      - name: Verify backup passphrase
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set"
            exit 1
          fi

      - name: Dump FitTrack database
        env:
          FITTRACK_DB_URL: ${{ secrets.FITTRACK_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$FITTRACK_DB_URL" ]; then
            echo "::error::FITTRACK_DB_URL secret is not set"
            exit 1
          fi
          pg_dump "$FITTRACK_DB_URL" \
            --no-owner \
            --no-privileges \
            --format=custom \
            --file=fittrack.dump
          gpg --batch --yes -c --passphrase "$BACKUP_PASSPHRASE" fittrack.dump
          rm fittrack.dump

      - name: Dump FitTrack Public database
        env:
          FITTRACK_PUBLIC_DB_URL: ${{ secrets.FITTRACK_PUBLIC_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$FITTRACK_PUBLIC_DB_URL" ]; then
            echo "::error::FITTRACK_PUBLIC_DB_URL secret is not set"
            exit 1
          fi
          pg_dump "$FITTRACK_PUBLIC_DB_URL" \
            --no-owner \
            --no-privileges \
            --format=custom \
            --file=fittrack-public.dump
          gpg --batch --yes -c --passphrase "$BACKUP_PASSPHRASE" fittrack-public.dump
          rm fittrack-public.dump

      - name: Dump Portfolio database
        env:
          PORTFOLIO_DB_URL: ${{ secrets.PORTFOLIO_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PORTFOLIO_DB_URL" ]; then
            echo "::error::PORTFOLIO_DB_URL secret is not set"
            exit 1
          fi
          pg_dump "$PORTFOLIO_DB_URL" \
            --no-owner \
            --no-privileges \
            --format=custom \
            --file=portfolio.dump
          gpg --batch --yes -c --passphrase "$BACKUP_PASSPHRASE" portfolio.dump
          rm portfolio.dump

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            fittrack.dump.gpg
            fittrack-public.dump.gpg
            portfolio.dump.gpg
          retention-days: 90
          if-no-files-found: error
